version: '3.9'

services:
  config-server:
    build: ./configserver
    container_name: config-server
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - app-network

  eureka-server:
    build: ./eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - config-server
    networks:
      - app-network

  api-gateway:
    build: ./gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - eureka-server
    networks:
      - app-network

  auth-service:
    build: ./auth
    container_name: auth-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - eureka-server
    networks:
      - app-network

  product-service:
    build: ./product
    container_name: product-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/product_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - eureka-server
    networks:
      - app-network

  cart-service:
    build: ./cart-service
    container_name: cart-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/cart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - eureka-server
    networks:
      - app-network

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      - SPRING_PROFILES_ACTIVE=d      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      - eureka-server
    networks:
      - app-network

  payment-service:
    build: ./payment
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/payment_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    depends_on:
      - eureka-server
    networks:
      - app-network
